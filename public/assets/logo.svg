<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Radar Hexagon -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" />
  <rect x="48" y="48" width="416" height="416" rx="96" fill="#080c14" opacity="0.92" />
  
  <!-- Inner Dynamic Radar Circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-dasharray="12 12" opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.6" />

  <!-- Center Media Camera / Play Bolt Symbol -->
  <path d="M190 160 L360 256 L190 352 Z" fill="url(#brandGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="40" fill="#06b6d4" opacity="0.8"/>
  
  <!-- Sparkles -->
  <path d="M380 120 L390 140 L410 150 L390 160 L380 180 L370 160 L350 150 L370 140 Z" fill="#06b6d4"/>
  <path d="M130 350 L138 365 L153 373 L138 381 L130 396 L122 381 L107 373 L122 365 Z" fill="#6366f1"/>
</svg>
